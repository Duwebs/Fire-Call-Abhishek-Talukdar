<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert Camera Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { background: #000; color: #0f0; font-family: monospace; text-align: center; margin: 0; padding: 10px; }
    .cam-box { position: relative; display: inline-block; width: 100%; max-width: 420px; }
    video { width: 100%; border: 2px solid #333; border-radius: 10px; }
    /* Beech ka focus box taaki aap text ko iske andar rakhein */
    .guide { position: absolute; top: 25%; left: 10%; width: 80%; height: 50%; border: 2px dashed #0f0; pointer-events: none; box-sizing: border-box; }
    #status { font-size: 14px; margin: 10px 0; color: #ccc; word-break: break-word; }
    #detected { color: #ff3b30; font-weight: bold; font-size: 20px; margin-top: 8px; }
  </style>
</head>
<body>
  <h3>OCR Alert Scanner (High Contrast)</h3>
  <div class="cam-box">
    <video id="video" autoplay playsinline></video>
    <div class="guide"></div>
  </div>
  <canvas id="canvas" style="display:none;"></canvas>
  <div id="status">Loading OCR engine...</div>
  <div id="detected"></div>

  <script>
    const PHONE_NUMBER = "+918882359259";
    // Inme se koi bhi ek word dikhte hi call lag jayegi
    const KEYWORDS = ["emergency", "fire", "alert", "detected"];

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const detectedEl = document.getElementById('detected');
    let callTriggered = false;
    let worker = null;

    async function keepScreenAwake() {
      try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
    }
    keepScreenAwake();

    async function init() {
      // Fast OCR worker initialize karein
      worker = await Tesseract.createWorker('eng');
      statusEl.innerText = "Starting camera...";

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = stream;
      statusEl.innerText = "Scanning inside green box...";

      setInterval(scanFrame, 1500);
    }

    async function scanFrame() {
      if (callTriggered || !worker || video.readyState !== video.HAVE_ENOUGH_DATA) return;

      // Sirf beech ka 80% x 50% area crop karein jahan green box hai (fast & accurate)
      const cropX = video.videoWidth * 0.1;
      const cropY = video.videoHeight * 0.25;
      const cropW = video.videoWidth * 0.8;
      const cropH = video.videoHeight * 0.5;

      canvas.width = cropW;
      canvas.height = cropH;

      // Contrast aur Grayscale badhayein taaki screen glare kam ho
      ctx.filter = "grayscale(100%) contrast(180%)";
      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      const { data: { text } } = await worker.recognize(canvas);
      const cleanText = text.toLowerCase().replace(/[^a-z0-9\s]/g, " ");
      
      statusEl.innerText = "Read: " + (cleanText.trim().slice(0, 60) || "Scanning...");

      const matchedWord = KEYWORDS.find(word => cleanText.includes(word));
      if (matchedWord) {
        callTriggered = true;
        detectedEl.innerText = `ALERT DETECTED (${matchedWord.toUpperCase()})! Calling...`;
        window.location.href = `tel:${PHONE_NUMBER}`;

        setTimeout(() => {
          callTriggered = false;
          detectedEl.innerText = "";
          statusEl.innerText = "Scanning resumed...";
        }, 30000);
      }
    }

    init().catch(err => { statusEl.innerText = "Error: " + err.message; });
  </script>
</body>
</html>
