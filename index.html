<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buzzer Alert Detector</title>
  <style>
    body { background: #050505; color: #fff; font-family: monospace; text-align: center; padding: 20px; margin: 0; }
    h2 { color: #0f0; margin-bottom: 5px; }
    button { background: #0f0; color: #000; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; }
    .meter-box { width: 100%; max-width: 350px; height: 28px; background: #222; border-radius: 14px; margin: 25px auto; overflow: hidden; border: 1px solid #444; }
    #bar { height: 100%; width: 0%; background: #0f0; transition: width 0.08s; }
    #info { font-size: 15px; color: #aaa; margin-top: 10px; }
    #alert { color: #ff3b30; font-size: 26px; font-weight: bold; margin-top: 25px; letter-spacing: 1px; }
    .slider-box { margin-top: 25px; color: #ccc; font-size: 14px; }
    input[type=range] { width: 80%; max-width: 300px; accent-color: #0f0; }
  </style>
</head>
<body>
  <h2>BUZZER CALL TRIGGER</h2>
  <p style="color:#888; font-size:13px;">Target: +918882359259</p>

  <button id="startBtn" onclick="startListening()">START LISTENING</button>

  <div class="meter-box">
    <div id="bar"></div>
  </div>
  <div id="info">Tap "START LISTENING" and allow Mic</div>

  <div class="slider-box">
    Trigger Level (Higher = Harder to Trigger): <span id="threshVal">75</span>%<br>
    <input type="range" id="threshold" min="30" max="95" value="75" oninput="document.getElementById('threshVal').innerText=this.value">
  </div>

  <div id="alert"></div>

  <script>
    let callTriggered = false;
    let loudFrames = 0;

    async function keepScreenAwake() {
      try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
    }

    async function startListening() {
      document.getElementById('startBtn').style.display = 'none';
      keepScreenAwake();

      try {
        // Auto Gain Control band rakha hai taaki chhoti awaaz amplify na ho
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            autoGainControl: false,
            noiseSuppression: false,
            echoCancellation: false
          }
        });

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);

        const freqData = new Uint8Array(analyser.frequencyBinCount);
        const timeData = new Uint8Array(analyser.fftSize);
        const bar = document.getElementById('bar');
        const info = document.getElementById('info');
        const alertBox = document.getElementById('alert');

        info.innerText = "Listening (Noise Filtered)...";

        function checkSound() {
          analyser.getByteFrequencyData(freqData);
          analyser.getByteTimeDomainData(timeData);

          // 1. Real Loudness (RMS) check - chhoti awaaz yahan filter hogi
          let sumSquares = 0;
          for (let i = 0; i < timeData.length; i++) {
            const norm = (timeData[i] - 128) / 128;
            sumSquares += norm * norm;
          }
          const rms = Math.sqrt(sumSquares / timeData.length);
          const volumeScore = Math.min(100, Math.round(rms * 250));

          // 2. High-Pitch Buzzer Frequency (2000Hz - 4500Hz) check
          let buzzerSum = 0;
          for (let i = 22; i < 55; i++) {
            buzzerSum += freqData[i];
          }
          const buzzerScore = Math.min(100, Math.round((buzzerSum / 33 / 255) * 100));

          // Dono high honge tabhi level badhega (normal baatcheet ignore hogi)
          const level = Math.round((volumeScore * 0.6) + (buzzerScore * 0.4));
          const threshold = parseInt(document.getElementById('threshold').value);

          bar.style.width = level + "%";
          bar.style.background = level >= threshold ? "#ff3b30" : "#0f0";

          if (!callTriggered) {
            if (level >= threshold) {
              loudFrames++;
              // Lagatar ~1.2 second (70 frames) tak tez buzzer baje tabhi trigger hoga
              if (loudFrames >= 70) {
                callTriggered = true;
                alertBox.innerText = "BUZZER DETECTED!";
                info.innerText = "Calling +918882359259 via MacroDroid...";

                setTimeout(() => {
                  callTriggered = false;
                  loudFrames = 0;
                  alertBox.innerText = "";
                  info.innerText = "Listening (Noise Filtered)...";
                }, 30000);
              }
            } else {
              // Awaaz rukte hi counter turant neeche girega
              loudFrames = Math.max(0, loudFrames - 5);
            }
          }
          requestAnimationFrame(checkSound);
        }
        checkSound();

      } catch (err) {
        document.getElementById('info').innerText = "Mic Error: " + err.message;
      }
    }
  </script>
</body>
</html>
