<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert Camera Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { background: #000; color: #0f0; font-family: monospace; text-align: center; margin: 0; padding: 10px; }
    .cam-box { position: relative; display: inline-block; width: 100%; max-width: 420px; }
    video { width: 100%; border: 2px solid #333; border-radius: 10px; background: #111; }
    .guide { position: absolute; top: 25%; left: 10%; width: 80%; height: 50%; border: 2px dashed #0f0; pointer-events: none; box-sizing: border-box; }
    #status { font-size: 14px; margin: 10px 0; color: #ffeb3b; word-break: break-word; }
    #detected { color: #ff3b30; font-weight: bold; font-size: 20px; margin-top: 8px; }
  </style>
</head>
<body>
  <h3>OCR Alert Scanner</h3>
  <div class="cam-box">
    <video id="video" autoplay playsinline muted></video>
    <div class="guide"></div>
  </div>
  <canvas id="canvas" style="display:none;"></canvas>
  <div id="status">1/2: Opening camera...</div>
  <div id="detected"></div>

  <script>
    const PHONE_NUMBER = "+918882359259";
    const KEYWORDS = ["emergency", "fire", "alert", "detected"];

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusEl = document.getElementById('status');
    const detectedEl = document.getElementById('detected');
    let callTriggered = false;
    let worker = null;

    async function keepScreenAwake() {
      try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
    }
    keepScreenAwake();

    async function startApp() {
      try {
        // Step 1: Pehle camera start karein
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        video.srcObject = stream;
        await video.play();
        statusEl.innerText = "2/2: Loading fast OCR (2 sec)...";

        // Step 2: Light-weight (1.5MB) English OCR model load karein
        worker = await Tesseract.createWorker('eng', 1, {
          langPath: 'https://tessdata.projectnaptha.com/4.0.0_fast'
        });

        statusEl.style.color = "#0f0";
        statusEl.innerText = "Ready! Point green box at text...";
        setInterval(scanFrame, 1500);

      } catch (err) {
        statusEl.style.color = "#ff3b30";
        statusEl.innerText = "Error: " + err.message;
      }
    }

    async function scanFrame() {
      if (callTriggered || !worker || video.readyState < 2) return;

      const cropX = video.videoWidth * 0.1;
      const cropY = video.videoHeight * 0.25;
      const cropW = video.videoWidth * 0.8;
      const cropH = video.videoHeight * 0.5;

      canvas.width = cropW;
      canvas.height = cropH;
      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      // High-contrast grayscale conversion (har mobile browser mein kaam karega)
      const imgData = ctx.getImageData(0, 0, cropW, cropH);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
        const contrast = avg > 128 ? 255 : 0; // Pure black & white threshold
        data[i] = data[i + 1] = data[i + 2] = contrast;
      }
      ctx.putImageData(imgData, 0, 0);

      const { data: { text } } = await worker.recognize(canvas);
      const cleanText = text.toLowerCase().replace(/[^a-z0-9\s]/g, " ").trim();

      if (cleanText.length > 0) {
        statusEl.innerText = "Read: " + cleanText.slice(0, 50);
      }

      const matchedWord = KEYWORDS.find(word => cleanText.includes(word));
      if (matchedWord) {
        callTriggered = true;
        detectedEl.innerText = `ALERT DETECTED (${matchedWord.toUpperCase()})! Calling...`;
        window.location.href = `tel:${PHONE_NUMBER}`;

        setTimeout(() => {
          callTriggered = false;
          detectedEl.innerText = "";
          statusEl.innerText = "Scanning resumed...";
        }, 30000);
      }
    }

    startApp();
  </script>
</body>
</html>
